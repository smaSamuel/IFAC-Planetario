services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planetario_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: planetario
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD} 
    depends_on:
      - db
    networks:
      - planetario_network
 
  db:
    image: postgres:16-alpine
    container_name: planetario_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: planetario
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Coloque aqui scripts .sql que devem rodar na criação do banco (ex: schema inicial)
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - planetario_network
 
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: planetario_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL} 
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD} 
    depends_on:
      - db
    networks:
      - planetario_network
 
networks:
  planetario_network:
    driver: bridge
 
volumes:
  db_data:

